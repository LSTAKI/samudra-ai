[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "orca-backend"
version = "1.0.0"
description = "Project ORCA — Marine Intelligence Platform Backend"
requires-python = ">=3.11"
readme = "README.md"

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
reload = true
log_level = "info"
